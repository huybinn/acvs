name: Auto Update Playlist
on:
  schedule:
    - cron: '0 */2 * * *' # 2 tiếng chạy 1 lần cho chắc
  workflow_dispatch: # Cho phép bấm nút chạy tay

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ép quyền ghi cho job này
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Libs
        run: pip install requests beautifulsoup4

      - name: Run Crawl
        run: python crawl.py

      - name: Check and Commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          # Chỉ commit nếu file có thay đổi nội dung
          git commit -m "Update playlist $(date)" || echo "No changes to commit"
          git push origin main
